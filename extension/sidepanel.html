<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blackboard Sync</title>
    <style>
      /*
        Extension side panel. Not part of the dashboard, so it follows its own
        look (warm base colours + one terracotta accent, light or dark from the
        system setting) instead of DESIGN.md.
      */
      :root {
        --bg: #faf9f5;
        --surface: #ffffff;
        --ink: #1f1e1d;
        --muted: #6b6a66;
        --border: #dad8d2;
        --accent: #d97757;
        --on-accent: #ffffff;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f1e1d;
          --surface: #2a2927;
          --ink: #faf9f5;
          --muted: #a3a199;
          --border: #3d3c39;
        }
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.45 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
      button:disabled { cursor: default; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      svg { display: block; flex: none; }

      .header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 16px 16px 4px; }
      .brand { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
      .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; white-space: nowrap; }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; border: 1.5px solid var(--muted); }
      .status-dot.on { background: var(--accent); border-color: var(--accent); }

      .tabs { display: flex; gap: 22px; padding: 0 16px; margin-top: 14px; border-bottom: 1px solid var(--border); }
      .tab { padding: 6px 0 8px; margin-bottom: -1px; border-bottom: 2px solid transparent; color: var(--muted); }
      .tab:hover { color: var(--ink); }
      .tab.active { color: var(--ink); font-weight: 500; border-bottom-color: var(--ink); }

      .content { padding: 16px; display: grid; gap: 12px; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
      .card h2 { font-size: 16px; font-weight: 500; margin: 0 0 4px; letter-spacing: -0.01em; }
      .card p { margin: 0; color: var(--muted); }
      .rows { margin-top: 14px; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--border); }
      .row-label { color: var(--muted); }
      .row-value { text-align: right; }
      .primary { width: 100%; height: 40px; margin-top: 12px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-weight: 600; }
      .primary:hover:not(:disabled) { filter: brightness(0.96); }
      .primary:disabled { opacity: 0.55; }
      .secondary { width: 100%; height: 38px; margin-top: 12px; border-radius: 9px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 8px; }
      .secondary:hover { border-color: var(--ink); }
      .note { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; color: var(--muted); font-size: 13px; }
      .link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
      .link:hover { color: var(--ink); }
      .error-text { color: var(--accent); }
      .alert { border-color: var(--accent); }
      .alert h2 { color: var(--accent); }
      /* Under a row: what was saved, or the exact error. */
      .detail { margin-top: -3px; padding: 0 0 9px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
      .detail > div + div { margin-top: 2px; }
      .detail.error-text, .detail .error-text { color: var(--accent); }

      /* Progress: the one indicator, horizontal. */
      .progress { margin-top: 14px; }
      .roadmap { display: flex; align-items: center; padding: 4px 2px; }
      .roadmap .line { flex: 1; height: 1.5px; background: var(--border); }
      .roadmap .line.done { background: var(--ink); }
      .circle { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--surface); display: grid; place-items: center; flex: none; }
      .circle.done { background: var(--ink); border-color: var(--ink); color: var(--surface); }
      .circle.current { border-color: var(--accent); }
      .circle.current::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
      .circle.error { border-color: var(--accent); color: var(--accent); }
      .bang { font-size: 13px; line-height: 1; }
      .step-text { margin-top: 10px; font-size: 13px; color: var(--muted); }

      .course-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 6px; color: var(--muted); }
      .text-button { color: var(--ink); font-weight: 500; }
      .group-label { color: var(--muted); font-size: 13px; margin: 4px 2px -4px; }
      .empty { color: var(--muted); text-align: center; padding: 28px 12px; }

      .field { display: grid; gap: 4px; margin-top: 12px; font-size: 13px; }
      .field input { height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); font: inherit; font-size: 14px; }
      .field input:focus { outline: none; border-color: var(--accent); }
      .cancel { margin: 10px auto 0; display: flex; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="dist/sidepanel.js"></script>
  </body>
</html>
